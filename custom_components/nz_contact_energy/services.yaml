import_usage:
  name: Import usage for date range
  description: Fetch Contact Energy usage for a specific past date range and insert it into the Energy Dashboard statistics.
  fields:
    start_date:
      name: Start date
      description: First day to import
      required: true
      selector:
        date:
    end_date:
      name: End date
      description: Last day to import (optional - leave empty for a single day)
      required: false
      selector:
        date:

recalculate_sums:
  name: Recalculate cumulative sums
  description: >
    Rebuild continuous cumulative sums for kWh, free kWh, and cost from
    statistics already stored in Home Assistant. Does not call Contact.
    Seeds from the day before the range and shifts days after so the
    Energy Dashboard stays continuous. Use after partial imports or
    negative spikes (energy or NZ$). Missing hours are not invented.
  fields:
    start_date:
      name: Start date
      description: First day to recalculate
      required: true
      selector:
        date:
    end_date:
      name: End date
      description: Last day to recalculate (optional - leave empty for a single day)
      required: false
      selector:
        date:
