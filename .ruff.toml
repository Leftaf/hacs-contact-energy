# Ruff config for NZ Contact Energy (custom HA integration)
# Keep rules that catch real bugs; silence HA-typical / complexity noise.

line-length = 88
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
  # Docstring / style
  "D100", "D101", "D102", "D103", "D104", "D105", "D107",
  "D203", "D213", "D401",
  # Annotations on every local / HA callback noise
  "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN401",
  # Complexity (fetch/rebuild paths are inherently branched)
  "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  # Magic floats used as float epsilon for sum continuity
  "PLR2004",
  # Boolean args used as flags in internal helpers
  "FBT001", "FBT002", "FBT003",
  # Exception message style (simple ValueError is fine)
  "TRY003", "TRY300", "EM101", "EM102",
  # Logging
  "G004",
  # HA uses assert in some tests; not relevant here
  "S101",
]

[lint.per-file-ignores]
# Config flow / setup glue
"__init__.py" = ["TC002", "TC003"]
"config_flow.py" = ["ARG001"]
